apiVersion: v1
kind: ConfigMap
metadata:
  name: nitrocore-config
  namespace: rigby-host
data:
  POSTGRES_HOST: "rigby-host-db-postgresql.rigby-host.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "rigby"
  S3_URL: "https://s3.eu-north-1.amazonaws.com"
  S3_ENDPOINT: "https://s3.eu-north-1.amazonaws.com"
  S3_BUCKET: "rigby-host-savedata"
  S3_REGION: "eu-north-1"
  REDIS_HOST: "rigby-host-redis-master.rigby-host.svc.cluster.local"
  REDIS_PORT: "6379"
  VERBOSE: "1"
  PORT: "3000"
