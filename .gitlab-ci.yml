stages:
  - build
  - deploy

variables:
  IMAGE: "${REGISTRY_HOST}/rigbyhost/nitrocore"

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"username\":\"${REGISTRY_USER}\",\"password\":\"${REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context dir://. --dockerfile Dockerfile --destination ${IMAGE}:${CI_COMMIT_SHA} --destination ${IMAGE}:latest --insecure --insecure-registry ${REGISTRY_HOST}

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/configmap.yaml
    - >
        kubectl create secret generic nitrocore-secrets -n rigby-host
        --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
        --from-literal=REDIS_URL="${REDIS_URL}"
        --from-literal=S3_ACCESS_KEY="${S3_ACCESS_KEY}"
        --from-literal=S3_SECRET="${S3_SECRET}"
        --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl rollout restart deployment/nitrocore -n rigby-host
  only:
    - main
    - master
