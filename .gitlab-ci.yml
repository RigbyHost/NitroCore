stages:
  - build
  - deploy

variables:
  IMAGE: "${REGISTRY_HOST}/rigbyhost/nitrocore"

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - Dockerfile*
        - package.json
        - bun.lock
        - tsconfig.json
        - types.d.ts
        - drizzle.config.ts
        - nitro.config*.ts
        - controller/**/*
        - drizzle/**/*
        - migrations/**/*
        - sdk/**/*
        - server/**/*
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"username\":\"${REGISTRY_USER}\",\"password\":\"${REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context dir://. --dockerfile Dockerfile --destination ${IMAGE}:${CI_COMMIT_SHA} --destination ${IMAGE}:latest --insecure --insecure-registry ${REGISTRY_HOST}

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
  needs:
    - job: build
      optional: true
  script:
    - kubectl apply -f k8s/configmap.yaml
    - >
        kubectl create secret generic nitrocore-secrets -n rigby-host
        --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
        --from-literal=REDIS_URL="${REDIS_URL}"
        --from-literal=S3_ACCESS_KEY="${S3_ACCESS_KEY}"
        --from-literal=S3_SECRET="${S3_SECRET}"
        --dry-run=client -o yaml | kubectl apply -f -
    - >
        kubectl create secret docker-registry registry-secret -n rigby-host
        --docker-server="${REGISTRY_HOST}"
        --docker-username="${REGISTRY_USER}"
        --docker-password="${REGISTRY_PASSWORD}"
        --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl apply -f k8s/redirect-ingress.yaml
    - kubectl rollout restart deployment/nitrocore -n rigby-host
